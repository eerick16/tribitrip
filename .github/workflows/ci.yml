name: CI TribiTrip

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, pruebas y compilación
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Instalar dependencias del frontend
        run: npm ci

      - name: Instalar dependencias del backend
        run: npm --prefix server ci

      - name: Ejecutar ESLint
        run: npm run lint

      - name: Compilar frontend
        run: npm run build

      - name: Ejecutar pruebas del backend y del frontend servido
        run: npm --prefix server test

      - name: Publicar frontend compilado
        uses: actions/upload-artifact@v7
        with:
          name: tribitrip-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error